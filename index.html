<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#11232c" />
    <meta
      name="description"
      content="Cinq tours, quatre complices, un FBI. Un braquage de musée, des promesses publiques et des choix secrets."
    />
    <title>Plan Foireux — Un casse presque parfait</title>
  </head>
  <body>
    <a class="skip-link" href="#phase">Aller au jeu</a>
    <div id="app">
      <header id="top"></header>
      <section id="phase" tabindex="-1"></section>
      <main id="playfield">
        <div id="scene"></div>
        <aside id="crew-controls" aria-label="Vos complices"></aside>
        <div id="lobby"></div>
        <section
          id="mobile-controls"
          aria-label="Postes et complices"
        ></section>
      </main>
      <footer id="footer"></footer>
    </div>
    <div
      id="phase-announcement"
      role="status"
      aria-live="polite"
      aria-atomic="true"
      hidden
    ></div>
    <div id="trial-root" hidden></div>
    <div id="modal-root"></div>
    <div id="pause-root" hidden></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
